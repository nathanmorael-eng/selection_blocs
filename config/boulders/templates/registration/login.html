{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="card">
    <h1>Connexion</h1>

    {% if form.errors %}
    <p class="error">Identifiant ou mot de passe incorrect.</p>
    {% endif %}

    <form method="post" class="form-page">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>
</div>
{% endblock %}
